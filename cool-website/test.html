<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <style>
    body{
      padding: 0;
      margin: 0;
    }
    .test{
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .test.active{
      opacity: 1;
    }
    .cursor{
      position: absolute;
      height: 20px;
      aspect-ratio: 1/1;
      background-color: black;
      border-radius: 50%;
    }

    .picture-section{
      position: relative;
      background-color: beige;
      height: 50vh;
      width: 100%;
    }

    .pic{
      position: absolute;
      height: 50%;
      width: 50%;
      background-color: rgb(90, 119, 246);

    }
    
    .pic:hover ~ .cursor{
      background-color: red;
    }
  </style>


  <div class="container"></div>
  <button class="hi">fade in and out lol</button>

  <div class="picture-section">
    <div class="pic"></div>
    <div class="cursor"></div>
  </div>







  <script>
    const cursor = document.querySelector('.cursor');
    document.addEventListener('mousemove', (el)=>{
      cursor.style.left = el.pageX - 10 + "px";
      cursor.style.top = el.pageY - 10 + "px";
    })
    const btn = document.querySelector(".hi");
    let active = false;
    const info = `<div class="test">hi I should fade in and out I am going crazy</div>`
    btn.addEventListener('click', ()=>{
      const container = document.querySelector('.container');
      if (!active){
        container.innerHTML += info;
        let text = document.querySelector('.test');
        setTimeout(()=>{
          text.classList.add('active');
        }, 100);
        
        active = true;
      } else{
        let text = document.querySelector('.test');
        text.classList.remove('active');
        let extra = document.querySelector('.test');
        setTimeout(()=>{
          extra.remove();
        }, 500)
        active = false;

      }
      
    })
  </script>
</body>
</html>
